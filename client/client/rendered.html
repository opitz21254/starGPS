<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./styles.css" />
  <title>Scheduler</title>
</head>

<body>
  <div class="home-hero-banner">
    <div class="home-hero-txt">
      <h1>SNOW COLLEGE</h1>
    </div>
    <div class="home-hero-img">
  <button type="button" class="caret-btn" aria-label="Previous semester">
    <img src="images/caret-left.svg" class="caret-icon" alt="">
  </button>
  <button type="button" class="caret-btn" aria-label="Next semester">
    <img src="images/caret-right.svg" class="caret-icon" alt="">
  </button>
</div>
  </div>
  <div id="semesterList">
    <section class="column" id="column1">
      <div class="sem-txt-box">
        <div class="course-top-txt">
          <h3>SEMESTER 1</h3>
        </div>
        <div class="course-top-img">
          <img src="images/plus-sign.svg" class="plus-icon" alt="Icon of a plus sign">
        </div>
      </div>
      <div class="white-sem-txt">
        <h2 class="course-info">CS 1410</h2>
        <p class="course-info">Intro to <strong>Programming</strong>.</p>
      </div>
      <div class="white-sem-txt">
        <h2 class="course-info">MATH 1010</h2>
        <p class="course-info">College Algebra</p>
      </div>
      <div class="white-sem-txt">
        <h2 class="course-info">ENGL 1010</h2>
        <p class="course-info">English Composition</p>
      </div>
    </section>
    <section class="column" id="column2">
      <div class="sem-txt-box">
        <div class="course-top-txt">
          <h3>SEMESTER 2</h3>
        </div>
        <div class="course-top-img">
          <img src="images/plus-sign.svg" class="plus-icon" alt="Icon of a plus sign">
        </div>
      </div>
      <div class="white-sem-txt">
        <h2 class="course-info">CS 1420</h2>
        <p class="course-info">Programming II</p>
      </div>
      <div class="white-sem-txt">
        <h2 class="course-info">MATH 1020</h2>
        <p class="course-info">PreCalculus</p>
      </div>
      <div class="white-sem-txt">
        <h2 class="course-info">ENGL 2010</h2>
        <p class="course-info">Technical Writing</p>
      </div>
    </section>
    <section class="column" id="column3">
      <div class="sem-txt-box" class="make-short-vert">
        <div class="course-top-txt">
          <h3>SEMESTER 3</h3>
        </div>
        <div class="course-top-img">
          <img src="images/plus-sign.svg" class="plus-icon" alt="Icon of a plus sign">
        </div>
      </div>
      <div class="white-sem-txt">
        <h2 class="course-info">CS 2410</h2>
        <p class="course-info">Data Structures</p>
      </div>
      <div class="white-sem-txt">
        <h2 class="course-info">MATH 2210</h2>
        <p class="course-info">Calculus I</p>
      </div>
      <div class="white-sem-txt">
        <h2 class="course-info">CS 2340</h2>
        <p class="course-info">Discrete Structures</p>
      </div>
    </section>
  </div>
</body>
</html>
