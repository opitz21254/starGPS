<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client & Guide Sign-In</title>
  <link rel="stylesheet" href="usedStyles.css" />
</head>

<body>
  <div>
    <div class="air3-fullscreen-container">
      <div class="fsr-overlay d-flex flex-column">
        <header></header>
        <main class="fsr-main d-flex align-items-start justify-content-center">
          <div class="fsr-content">
            <div class="fsr-step1">
              <div class="d-flex heading-container align-items-center mb-6x">
                <button class="air3-btn air3-btn-circle d-none d-md-flex flex-shrink-0">
                  <span class="sr-only">Back</span>
                  <div class="air3-icon sm">
                    <img src="img/caret-left.svg" class="caret-icon" alt="" />
                  </div>
                </button>
                <h2 class="display-rebrand text-center my-6x flex-1">
                  Join as a client or guide
                </h2>
              </div>
              <fieldset class="fsr-step1-cards">
                <legend class="sr-only">Join as a client or guide</legend>
                <div class="fsr-step1-cards-grid">
                  <button>
                    <div class="accout-type-gradient">
                      <div class="air3-icon xl account-type-icon">
                        <img src="img/person-client copy.svg" class="account-type-icon-img" alt="" />
                      </div>
                    </div>
                    <div class="clearview-role-card-caption">
                      <div class="account-type-title">
                        Client
                        <div class="air3-icon sm account-type-arrow">
                          <img src="img/right-arrow.svg" class="arrow-icon" alt="" />
                        </div>
                      </div>
                      <div class="text-muted">Search & Shop GPS</div>
                    </div>
                  </button><button class="air3-thumbnail p-0 clearview-role-card h-100 type-work">
                    <div class="accout-type-gradient">
                      <div class="air3-icon xl account-type-icon">
                        <img src="img/person-guide copy.svg" class="account-type-icon-img" alt="" />
                      </div>
                    </div>
                    <div class="clearview-role-card-caption">
                      <div class="account-type-title">
                        Guide
                        <div class="air3-icon sm account-type-arrow">
                          <img src="img/right-arrow.svg" class="arrow-icon" alt="" />
                        </div>
                      </div>
                      <div class="text-muted">
                        Work and get paid
                      </div>
                    </div>
                  </button>
                </div>
              </fieldset>
              <!---->
              <p class="text-center text-body">
                Already have an account?
                <a href="https://www.example.com/ab/account-security/login" class="link">Log In</a>
              </p>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <br /><br />
</body>

</html>
