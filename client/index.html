<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client & Guide Sign-In</title>
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div>
    <div class="fullscreen-container">
      <div class="signup-overlay signup-bg-gradient d-flex flex-column">
        <header></header>
        <main class="signup-main d-flex align-items-start justify-content-center">
          <div class="signup-content">
            <div class="role-select-step">
              <div class="d-flex heading-container align-items-center mb-6x">
                <button class="btn btn-circle d-none d-md-flex flex-shrink-0">
                  <span class="sr-only">Back</span>
                  <div class="icon sm">
                    <img src="img/caret-left.svg" class="caret-icon" alt="" />
                  </div>
                </button>
                <h2 class="display-title text-center my-6x flex-1">
                  Welcome to starGPS
                </h2>
              </div>
              <p class="signup-subtitle text-center">Which describes you best?</p>
              <fieldset class="role-cards">
                <div class="role-cards-grid">
                  <button class="selection-card p-0 role-card h-100 type-client">
                    <div class="account-type-gradient">
                      <div class="icon xl account-type-icon">
                        <img src="img/person-client copy.svg" class="account-type-icon-img" alt="" />
                      </div>
                    </div>
                    <div class="role-card-caption">
                      <div class="account-type-title">
                        Client
                        <div class="icon sm account-type-arrow">
                          <img src="img/right-arrow.svg" class="arrow-icon" alt="" />
                        </div>
                      </div>
                      <div class="text-muted">Search & Shop GPS</div>
                    </div>
                  </button><button class="selection-card p-0 role-card h-100 type-guide" onclick="window.location.href='signup/'">
                    <div class="account-type-gradient">
                      <div class="icon xl account-type-icon">
                        <img src="img/person-guide copy.svg" class="account-type-icon-img" alt="" />
                      </div>
                    </div>
                    <div class="role-card-caption">
                      <div class="account-type-title">
                        Guide
                        <div class="icon sm account-type-arrow">
                          <img src="img/right-arrow.svg" class="arrow-icon" alt="" />
                        </div>
                      </div>
                      <div class="text-muted">
                        Work and get paid
                      </div>
                    </div>
                  </button>
                </div>
              </fieldset>
              <!---->
              <br><br>
              <p class="text-center text-body">
                Already have an account?
                <a href="https://www.example.com/ab/account-security/login" class="link">Log In</a>
              </p>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <br /><br />
</body>

</html>
