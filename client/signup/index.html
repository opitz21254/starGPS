<!doctype html>
<html lang="en" theme="air-3-0">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script type="module" src="./source/ui.js"></script>
    <title>Create an account to book expedition guides</title>
    <link rel="stylesheet" href="star-gps-signup.css" />
  </head>

  <body theme="air-3-0">
    <div class="microapp-slot-top">
      <div class="ma-scope_visitor-skinny" id="visitor-skinny-app-container">
        <header></header>
        <div class="layout">
          <div class="visitor-skinny-app-loader"></div>
          <main id="main">
            <div>
              <div
                class="container air3-grid-container"
                id="signup-redesigned-form"
              >
                <div class="sr-only" id="loading-status"></div>
                <div class="page-container">
                  <div class="page-card mt-8x my-md-10x mb-0 mb-md-10x py-0">
                    <h2 class="text-center display-rebrand my-6x">
                      <div>
                        <span>Sign up to guide</span>
                      </div>
                    </h2>
                    <div class="text-center"></div>
                    <div class="air3-grid-container my-6x my-md-10x col-gap-4x">
                      <div class="span-12 span-md-6 sso-button-container">
                        <button
                          class="air3-btn mr-0 apple-sso-button full-width mb-0 air3-btn-primary p-0"
                          type="button"
                        >
                          <div class="mr-2x air3-icon sm">
                            <img src="images/apple-logo-signup.svg" alt="Apple" />
                          </div>
                          <span>Continue with Apple</span>
                        </button>
                      </div>
                      <div class="span-12 sso-button-container span-md-6">
                        <div>
                          <div>
                            <div id="up_gsi_button">
                              <button class="google-sso-static" type="button">
                                <span class="google-sso-static-logo">
                                  <img
                                    src="images/google-logo-signup.svg"
                                    alt="Google"
                                  />
                                </span>
                                <span>Continue with Google</span>
                              </button>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                    <p class="google-sso-separator my-6x">
                      <span class="p-0 px-3x"> or </span>
                    </p>

                    <!--Start Name Container-->
                    <form id="signupForm-redesigned">
                      <div>
                        <label for="first-name-input">First Name</label>
                        <input id="clientName" name="clientName" />
                      </div>
                      <div>
                        <input type="submit" />
                      </div>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </main>
        </div>
      </div>
    </div>
  </body>
</html>
