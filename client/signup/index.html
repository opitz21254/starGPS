<!doctype html>
<html lang="en" theme="air-3-0">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script type="module" src="./source/ui.js"></script>
  <title>Create an account to book expedition guides</title>
  <link rel="stylesheet" href="star-gps-signup.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap"
    rel="stylesheet" />
</head>

<body theme="air-3-0">
  <div class="signup-nav-slot">
    <div class="signup-nav-scope" data-app="signup-nav" id="signup-nav-container" theme="air-3-0">
      <header class="nav-scrolled-top" data-internal-app="signup-nav" data-qa="signup-nav"
        id="signup-nav">
        <div class="signup-nav-header">
          <a class="up-n-link nav-brand" data-cy="brand" href="https://www.example.com/" target="_self">
            <span class="sr-only">StarGPS home</span>
            <span class="nav-logo">
              <img src="images/stargps-logo.png" alt="StarGPS" />
            </span>
          </a>
        </div>
        <div class="signup-nav-center"></div>
        <nav aria-label="Primary">
          <ul class="signup-nav-right">
            <li>
              <span class="nav-d-none nav-d-lg-inline">Looking for work?</span>
              <a class="up-n-link nav-air3-btn nav-air3-btn-link nav-d-none nav-d-lg-inline-flex pr-0"
                href="https://www.example.com/nx/signup/?dest=home">
                Apply as talent
              </a>
            </li>
          </ul>
        </nav>
      </header>
    </div>
  </div>

  <div id="signup-app">
    <div id="signup-layout">
      <div class="layout-container">
        <div class="layout">
          <div class="signup-app-loader"></div>
          <main id="main" tabindex="-1">
            <div>
              <div class="container air3-grid-container" data-signup-scope="" id="signup-form-section">
                <div aria-live="polite" class="sr-only" data-signup-scope="" id="loading-status" role="status"></div>
                <div class="page-container" data-signup-scope="">
                  <div class="page-card mt-8x my-md-10x mb-0 mb-md-10x py-0" data-signup-scope="">
                    <h2 class="text-center display-title my-6x" data-signup-scope="">
                      <div data-signup-scope="">
                        <span data-signup-scope="">Sign up to guide</span>
                      </div>
                    </h2>
                    <div class="text-center" data-signup-scope=""></div>
                    <div data-signup-scope="">
                      <div class="air3-grid-container my-6x my-md-10x col-gap-4x" data-signup-scope="">
                        <div class="span-12 span-md-6 sso-button-container" data-signup-scope="">
                          <button class="air3-btn mr-0 apple-sso-button full-width mb-0 air3-btn-primary p-0"
                            data-signup-scope="" type="button">
                            <div class="mr-2x air3-icon sm">
                              <img src="images/apple-logo-signup.svg" alt="Apple" />
                            </div>
                            <span>Continue with Apple</span>
                          </button>
                        </div>
                        <div class="span-12 sso-button-container span-md-6" data-signup-scope="">
                          <div data-signup-scope="">
                            <div>
                              <div id="up_gsi_button">
                                <button class="google-sso-static" type="button">
                                  <span class="google-sso-static-logo">
                                    <img src="images/google-logo-signup.svg" alt="Google" />
                                  </span>
                                  <span>Continue with Google</span>
                                </button>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                      <p class="google-sso-separator my-6x" data-signup-scope="">
                        <span class="p-0 px-3x" data-signup-scope=""> or </span>
                      </p>
                    </div>

                    <form data-signup-scope="" id="signup-form">
                      <!-- -->
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </main>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
